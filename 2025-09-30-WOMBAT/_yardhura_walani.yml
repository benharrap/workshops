logo:
  images:
    primary:
      path: img/logo.png
      alt: "Yarhura Walani logo"

color:
  palette:
    green: "#34665C"
    blue: "#325d74"
    teal: "#69a3a3"
    cream: "#ede8d1"
    red: "#c4624c"
    orange: "#e9a148"
